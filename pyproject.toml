[project]
name = "snip-ocr"
version = "0.1.0"
description = "Screenshot to Markdown converter with AI-powered OCR and LaTeX support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ocr", "screenshot", "markdown", "latex", "ai", "gpt-4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "pillow>=10.0.0",
    "pynput>=1.7.0",
    "pyperclip>=1.8.0",
    "pyqt6>=6.5.0",
    "requests>=2.31.0",
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/username/snip-ocr"
Repository = "https://github.com/username/snip-ocr"
Issues = "https://github.com/username/snip-ocr/issues"

[project.scripts]
snip-ocr = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snip_ocr"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
]
