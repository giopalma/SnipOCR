name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SnipOCR.exe
            artifact_path: dist/SnipOCR.exe
          - os: macos-latest
            artifact_name: SnipOCR.app
            artifact_path: dist/SnipOCR.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: uv run pyinstaller snip_ocr.spec --distpath dist --workpath build --noconfirm

      - name: Compress macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r SnipOCR-macOS.zip SnipOCR.app

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SnipOCR-Windows
          path: dist/SnipOCR.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SnipOCR-macOS
          path: dist/SnipOCR-macOS.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SnipOCR-Windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SnipOCR-macOS
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SnipOCR.exe
            artifacts/SnipOCR-macOS.zip
          generate_release_notes: true
